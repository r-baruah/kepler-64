[workspace]
resolver = "3"
members = ["crates/kepler-core", "crates/kepler-uci", "crates/kepler-train"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/r-baruah/kepler-64"

[workspace.dependencies]
cozy-chess = "0.3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 1

[profile.test]
opt-level = 3
