name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU JAX)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        # JAX needs the XLA CPU target on CI runners; the suite is CPU-only.
        env:
          JAX_PLATFORMS: cpu
        run: python -m pytest kepler64/tests/ -q --tb=short

      - name: Engine smoke — one searched move
        env:
          JAX_PLATFORMS: cpu
        run: |
          python - <<'PY'
          import chess
          from kepler64 import RocheEngine
          eng = RocheEngine(load_trained=False)
          b = chess.Board()
          mv = eng.play(b, depth=2)
          assert mv is not None and mv in b.legal_moves
          print("smoke OK:", b.san(mv))
          PY
