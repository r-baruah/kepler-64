<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Direction B on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1a1a1a}a:hover{color:#555}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f4f4f4; color: #1a1a1a; font-family: system-ui, sans-serif; display: flex; flex-direction: column">
<header style="height: 52px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 10px">
<div style="font-weight: 700; font-size: 17px; flex-grow: 1">Kepler-64</div>
<a href="#" style="height: 44px; padding: 0 12px; border: 1px solid #1a1a1a; border-radius: 6px; display: flex; align-items: center; text-decoration: none; font-size: 13px">Star · [STARS]</a>
</header>
<div style="padding: 0 16px 6px; display: flex; justify-content: space-between; font-size: 12px; color: #333"><span>Kepler's king 0.7 / 21.1</span><span>Your king 2.2 / 25.6</span></div>
<div style="padding: 0 16px">
<dc-import name="Board" fen="r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R" tint=".BBbbbB.BBbBBbbBwbbBbBbbbWbwb.bbwbwbwbbb.wwWwWw.WwWWWwWw.wwwWWW." marks=".l.h....h...h.....l.....h...h....h.h............................" palette="light" size="{{boardSize}}" field="{{yes}}" hint-size="358px,358px"></dc-import>
</div>
<div style="margin: 12px 16px 0; background: #ffffff; border: 2px solid #1a1a1a; border-radius: 8px; padding: 12px 14px; font-size: 14px; line-height: 1.5">
<div style="font-size: 11px; color: #555; margin-bottom: 4px">2... Nc6 · KEPLER · +0.45 ku for Kepler</div>
Kepler's knight now pulls on 8 squares (outlined), including e5, where it holds its own pawn, and d4.
</div>
<div style="margin: 8px 16px 0; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #444">
<button style="height: 44px; padding: 0 12px; font: inherit; border: 1px solid #9a9a9a; border-radius: 6px; background: #ffffff">Earlier moves</button>
<span>Light: White's pull · Shade: Black's</span>
</div>
<nav aria-label="Game controls" style="margin-top: auto; height: 64px; border-top: 1px solid #d0d0d0; background: #ffffff; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); font-size: 12px">
<button style="font: inherit; border: none; background: none">New</button>
<button style="font: inherit; border: none; background: none">Undo</button>
<button style="font: inherit; border: none; background: none">Field</button>
<button style="font: inherit; border: none; background: none">Universe</button>
<button style="font: inherit; border: none; background: none">More</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true, boardSize: 358 }; }
}
</script>
</body>
</html>
