<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Direction A on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1a1a1a}a:hover{color:#555}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ececec; color: #1a1a1a; font-family: system-ui, sans-serif; display: flex; flex-direction: column">
<header style="height: 52px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 10px">
<div style="font-weight: 700; font-size: 17px; flex-grow: 1">Kepler-64</div>
<a href="#" style="height: 44px; padding: 0 12px; border: 1px solid #1a1a1a; border-radius: 6px; display: flex; align-items: center; text-decoration: none; font-size: 13px">Star · [STARS]</a>
</header>
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 0 16px">
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px">
<span><span style="font-weight: 600">Kepler</span> <span style="color: #444">Gen 4 · Default</span></span>
<span style="display: flex; align-items: center; gap: 6px; color: #444">0.7 / 21.1 <span style="width: 56px; height: 5px; background: #cfcfcf; border-radius: 3px; display: inline-block"><span style="display: block; width: 3%; height: 5px; background: #1a1a1a; border-radius: 3px"></span></span></span>
</div>
<dc-import name="Board" fen="r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R" tint=".BBbbbB.BBbBBbbBwbbBbBbbbWbwb.bbwbwbwbbb.wwWwWw.WwWWWwWw.wwwWWW." marks=".l................l............................................." palette="light" size="{{boardSize}}" field="{{yes}}" hint-size="358px,358px"></dc-import>
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px">
<span><span style="font-weight: 600">You</span> <span style="color: #444">your move</span></span>
<span style="display: flex; align-items: center; gap: 6px; color: #444">2.2 / 25.6 <span style="width: 56px; height: 5px; background: #cfcfcf; border-radius: 3px; display: inline-block"><span style="display: block; width: 8%; height: 5px; background: #1a1a1a; border-radius: 3px"></span></span></span>
</div>
<div style="font-size: 13px; color: #333; text-align: center; margin-top: 6px">Kepler played Nc6 · +0.45 ku for Kepler</div>
</div>
<nav aria-label="Game controls" style="margin: 12px 16px 20px; height: 60px; background: #ffffff; border: 1px solid #bdbdbd; border-radius: 30px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); font-size: 12px">
<button style="font: inherit; border: none; background: none">New</button>
<button style="font: inherit; border: none; background: none">Undo</button>
<button style="font: inherit; border: none; background: none">Field</button>
<button style="font: inherit; border: none; background: none">Universe</button>
<button style="font: inherit; border: none; background: none">More</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true, boardSize: 358 }; }
}
</script>
</body>
</html>
