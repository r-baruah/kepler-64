<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Concept 2: Mission, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#14213D}a:hover{color:#2F5BFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F9; color: #14213D; font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column">
<header style="height: 56px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #DCE0E7">
<div style="font-weight: 600; font-size: 16px; flex-grow: 1">Kepler-64</div>
<a href="#" style="height: 40px; padding: 0 12px; display: flex; align-items: center; font-size: 12px; text-decoration: none; background: #14213D; color: #FFFFFF; border-radius: 8px">Star · [STARS]</a>
</header>
<div style="padding: 14px 16px 0; display: flex; justify-content: space-between; align-items: flex-end">
<div><div style="font-family: 'Geist Mono', monospace; font-size: 10px; color: #5B6478">KEPLER'S VIEW</div><div style="font-size: 36px; font-weight: 300; letter-spacing: -0.04em; line-height: 1">+0.45 <span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0; color: #5B6478">KU</span></div></div>
<div style="text-align: right; font-family: 'Geist Mono', monospace; font-size: 10px; color: #5B6478; line-height: 1.6">CHAMPION · GEN 4<br>DEFAULT LEVEL</div>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 0 16px">
<div style="display: flex; justify-content: space-between; font-family: 'Geist Mono', monospace; font-size: 10px; color: #5B6478"><span><span style="font-family: Geist, sans-serif; font-size: 13px; font-weight: 600; color: #14213D">Kepler</span></span><span>pull on king 0.7 / 21.1</span></div>
<dc-import name="BoardHi" fen="r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R" tint=".BBbbbB.BBbBBbbBwbbBbBbbbWbwb.bbwbwbwbbb.wwWwWw.WwWWWwWw.wwwWWW." marks=".l.h....h...h.....l.....h...h....h.h............................" theme="mission" size="{{boardSize}}" hint-size="358px,358px"></dc-import>
<div style="display: flex; justify-content: space-between; font-family: 'Geist Mono', monospace; font-size: 10px; color: #5B6478"><span><span style="font-family: Geist, sans-serif; font-size: 13px; font-weight: 600; color: #14213D">You</span> <span style="color: #2F5BFF">● YOUR MOVE</span></span><span>pull on king 2.2 / 25.6</span></div>
<div style="margin-top: 8px; border-top: 1px solid #DCE0E7; padding-top: 12px; font-size: 14px; line-height: 1.5; color: #2A3550"><span style="font-family: 'Geist Mono', monospace; font-size: 10px; color: #2F5BFF">2… Nc6</span><br>Kepler's knight now pulls on 8 squares, including e5, where it holds its own pawn, and d4.</div>
</div>
<nav aria-label="Game controls" style="margin: 8px 16px 20px; height: 56px; border: 1px solid #DCE0E7; border-radius: 12px; background: #FFFFFF; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); font-size: 12px">
<button style="font: inherit; color: #14213D; border: none; background: none">New</button>
<button style="font: inherit; color: #14213D; border: none; background: none">Undo</button>
<button style="font: inherit; color: #14213D; border: none; background: none">Field</button>
<button style="font: inherit; color: #14213D; border: none; background: none">Universe</button>
<button style="font: inherit; color: #14213D; border: none; background: none">More</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { boardSize: 358 }; }
}
</script>
</body>
</html>
