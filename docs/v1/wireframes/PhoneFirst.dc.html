<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone: first visit</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1a1a1a}a:hover{color:#555}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #fafafa; color: #1a1a1a; font-family: system-ui, sans-serif; display: flex; flex-direction: column">
<header style="height: 52px; box-sizing: border-box; padding: 0 16px; border-bottom: 1px solid #d0d0d0; display: flex; align-items: center; gap: 12px">
<div style="font-weight: 700; font-size: 18px; flex-grow: 1">Kepler-64</div>
<a href="#" style="height: 44px; padding: 0 12px; border: 1px solid #1a1a1a; border-radius: 6px; display: flex; align-items: center; text-decoration: none; font-size: 13px">Star · [STARS]</a>
<button aria-label="Menu" style="width: 44px; height: 44px; font: inherit; border: 1px solid #9a9a9a; border-radius: 6px; background: #ffffff">=</button>
</header>
<div style="padding: 12px 16px 0; font-size: 14px; color: #444">A tiny universe that learned to play chess.</div>
<div style="padding: 10px 16px">
<dc-import name="Board" fen="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR" tint=".bbbBbb.BbBBBbbBbbbbbbbb................wwwwwwwwWwWWWwwW.wwwWww." marks="" size="{{boardSize}}" field="{{yes}}" hint-size="358px,358px"></dc-import>
</div>
<div style="padding: 0 16px; font-size: 13px; color: #444; line-height: 1.45">Coloured squares show each side's pull. <a href="#">How does this work?</a></div>
<div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 10px">
<button style="flex-grow: 1; height: 52px; font: inherit; font-size: 16px; border-radius: 6px; border: 1px solid #1a1a1a; background: #1a1a1a; color: #ffffff">Play White</button>
<button style="flex-grow: 1; height: 52px; font: inherit; font-size: 16px; border-radius: 6px; border: 1px solid #1a1a1a; background: #ffffff; color: #1a1a1a">Play Black</button>
</div>
<div style="font-size: 13px; color: #333; display: flex; gap: 6px; flex-wrap: wrap"><span>Champion (Gen 4)</span><span style="color: #888">·</span><span>Default level</span><span style="color: #888">·</span><span>strength not measured yet</span></div>
</div>
<nav style="margin-top: auto; height: 64px; border-top: 1px solid #d0d0d0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); font-size: 12px">
<button style="font: inherit; border: none; background: none">New</button>
<button style="font: inherit; border: none; background: none">Undo</button>
<button style="font: inherit; border: none; background: none">Flip</button>
<button style="font: inherit; border: none; background: none">Field</button>
<button style="font: inherit; border: none; background: none">Universe</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true, boardSize: 358 }; }
}
</script>
</body>
</html>
