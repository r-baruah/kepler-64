[project]
name = "kepler64"
version = "0.1.0"
description = "An astrophysical chess engine — differentiable N-body gravity replaces heuristic evaluation."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4",
    "jaxlib>=0.4",
    "numpy",
    "matplotlib",
    "python-chess",
    "optax",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/TODO/kepler64"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["kepler64*"]
