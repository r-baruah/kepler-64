[project]
name = "kepler64"
version = "0.1.0"
description = "A physics-inspired, differentiable chess evaluator built with JAX."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4",
    "jaxlib>=0.4",
    "numpy",
    "matplotlib",
    "python-chess",
    "optax",
    "imageio",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest", "scipy"]

[project.urls]
Repository = "https://github.com/r-baruah/kepler-64"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["kepler64*"]
