<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kepler-64</title>
<meta name="description" content="Kepler-64 is being rebuilt: a chess engine whose only judgement is a physical field shaped by the rules of chess.">
<style>
  :root { --bg: #0b0e14; --ink: #e8ecf4; --muted: #9aa4b8; --accent: #f4b860; }
  @media (prefers-color-scheme: light) { :root { --bg: #f5f7fb; --ink: #0f1a2e; --muted: #4a5873; --accent: #9a6412; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 17px/1.6 system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 34rem; }
  h1 { font-size: 2rem; margin: 0 0 .5rem; }
  p { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Kepler-64 is being rebuilt</h1>
  <p>A tiny universe that plays chess. The new version is a ground-up rewrite: the rules of chess shape the field
  itself, and the engine learns its constants by playing itself. A new site with a playable board is on its way.</p>
  <p><a href="https://github.com/r-baruah/kepler-64">Follow it on GitHub</a> &middot;
  <a href="https://github.com/r-baruah/kepler-64/tree/v1/docs/v1">Read the v1 docs</a></p>
</main>
</body>
</html>
